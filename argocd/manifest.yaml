apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: pahri-k8s
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/muhammadyulasfipahrizal/gitops.git
    targetRevision: main
    path: charts/app
    helm:
      valueFiles:
        - ../../environments/production/values-prod.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: pahri-k8s

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true