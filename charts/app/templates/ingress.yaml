apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: {{ include "app.fullname" . }}

spec:
  ingressClassName: traefik
  rules:
  - host: demo.k8s.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "app.fullname" . }}
            port:
              number: 8080